<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Demo no encontrada · Velority</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0b0d1a;--tx:#f3f3f8;--mu:#a3a6bf}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);
background:radial-gradient(700px 500px at 80% 10%,rgba(255,79,139,.22),transparent 60%),radial-gradient(700px 500px at 10% 100%,rgba(124,92,255,.25),transparent 60%),var(--bg)}
main{max-width:520px;text-align:center}
img{width:78px;height:78px;margin:0 auto 22px;display:block}
.marca{font-weight:800;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:var(--mu);margin-bottom:26px}
h1{font-size:clamp(28px,6vw,40px);line-height:1.15;margin-bottom:16px}
p{color:var(--mu);font-size:17px;line-height:1.6;margin-bottom:30px}
a.btn{display:inline-block;padding:14px 26px;border-radius:12px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(90deg,#ff8a3d,#ff4f8b)}
a.btn:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<main>
  <img src="/logo.svg" alt="">
  <div class="marca">Velority</div>
  <h1>Esta demo no existe</h1>
  <p>Puede que la dirección esté mal escrita o que la demo haya cambiado. Revisa el enlace que te enviamos o escríbenos desde velority.es.</p>
  <a class="btn" href="https://velority.es/">Ir a velority.es</a>
</main>
</body>
</html>
